<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>الصفحة غير موجودة (404) | متجر T-REX SHOP</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }
        .card {
            max-width: 560px;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 45px 30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }
        .code {
            font-size: 76px;
            font-weight: 900;
            color: #FFD700;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        p {
            color: #a0a0a0;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>عذراً، هذه الصفحة غير موجودة</h1>
        <p>الرابط الذي تحاول الوصول إليه قد تم نقله أو حذفه أو كُتب بشكل غير صحيح. يمكنك العودة إلى الصفحة الرئيسية للمتجر أو تصفح أدلة التسوق في مدونتنا المعرفية.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> الرئيسية والمتجر</a>
            <a href="/blog" class="btn btn-outline"><i class="fas fa-newspaper"></i> المدونة المعرفية</a>
            <a href="/contact-us" class="btn btn-outline"><i class="fas fa-headset"></i> تواصل معنا</a>
        </div>
    </main>
</body>
</html>
