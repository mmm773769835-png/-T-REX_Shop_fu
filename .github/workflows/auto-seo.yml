name: Auto SEO & Google Feed Sync

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  # Allows manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SEO pages, sitemap & Google Shopping Feed
        run: node generate-seo.js

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml google-shopping-feed.xml products/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(seo): auto-sync products, sitemap and google feeds [skip ci]"
            git push
          fi
